name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: Build SkyRealm Hub APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate mobile Hub account flow
        run: |
          node --check app/src/main/assets/skyrealm/hub-auth.js
          node --check hub-auth.js
          node --check app/src/main/assets/apocalypse-coop.js
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('app/src/main/assets/hub.html', 'utf8');
          const preview = fs.readFileSync('hub.html', 'utf8');
          const js = fs.readFileSync('app/src/main/assets/skyrealm/hub-auth.js', 'utf8');
          const java = fs.readFileSync('MainActivity.java', 'utf8');
          const manifest = fs.readFileSync('app/src/main/AndroidManifest.xml', 'utf8');
          const requiredBridge = [
            'openUpdate()', 'getAppVersion()', 'isGameInstalled(String id)',
            'DownloadManager', 'ACTION_DOWNLOAD_COMPLETE', 'ACTION_MANAGE_UNKNOWN_APP_SOURCES'
          ];
          const requiredHtml = [
            'id="account-open"', 'id="account-nav"', 'id="account-form"',
            'id="account-verify"', 'id="account-resend"', 'id="account-logout"',
            'skyrealm/config.js', 'skyrealm/hub-auth.js', 'skyrealm/hub-auth.css'
          ];
          const requiredJs = [
            '/api/auth/register', '/api/auth/verify', '/api/auth/resend',
            '/api/auth/login', '/api/auth/refresh', '/api/auth/logout'
          ];
          const missing = [
            ...requiredHtml.filter(x => !html.includes(x)),
            ...requiredJs.filter(x => !js.includes(x)),
            ...requiredBridge.filter(x => !java.includes(x)),
            ...['REQUEST_INSTALL_PACKAGES'].filter(x => !manifest.includes(x)),
            ...['id="account-open"', 'id="account-form"', 'hub-auth.js', 'hub-auth.css'].filter(x => !preview.includes(x))
          ];
          if (missing.length) throw new Error('Mobile account flow missing: ' + missing.join(', '));
          console.log('Mobile Hub account registration, verification, login and session checks passed.');
          NODE

      - name: Validate detailed Apocalypse update journal
        run: |
          node --check app/src/main/assets/apocalypse-changelog.js
          node --check app/src/main/assets/apocalypse.js
          node scripts/validate-apocalypse-changelog.cjs

      - name: Read app version
        id: app_version
        run: echo "version=$(tr -d '\r\n' < version.txt)" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      # Keep the generated debug signing certificate stable between release builds.
      # This is a development distribution key; use a private release keystore before public production distribution.
      - name: Reuse stable Android update signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: skyrealm-hub-debug-signing-v1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify project files
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SkyRealm-Hub-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish installable update
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hub-v${{ steps.app_version.outputs.version }}
          name: SkyRealm Hub ${{ steps.app_version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
