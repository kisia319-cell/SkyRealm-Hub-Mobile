name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: Build SkyRealm Hub APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read app version
        id: app_version
        run: echo "version=$(tr -d '\r\n' < version.txt)" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify project files
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SkyRealm-Hub-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish installable update
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hub-v${{ steps.app_version.outputs.version }}
          name: SkyRealm Hub ${{ steps.app_version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
