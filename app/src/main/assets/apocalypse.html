<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101914"><title>SkyRealm: Apocalypse</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101914;color:#edf3e9;font-family:system-ui,Arial}canvas{width:100%;height:100%;display:block;touch-action:none}.hud{position:absolute;inset:12px 12px auto;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}.panel{background:#101b17eF;border:1px solid #82908055;border-radius:12px;padding:10px 13px;box-shadow:0 5px 20px #0006;backdrop-filter:blur(7px)}.brand{font-size:11px;letter-spacing:2px;color:#d5a66a;font-weight:900}.stat{font-size:12px;margin-top:5px}.quest{width:min(260px,48vw)}.quest b{font-size:12px;color:#e9c58d}.quest p{font-size:11px;line-height:1.45;margin:5px 0;color:#c5d0c2}.bottom{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:7px;align-items:center}.btn{pointer-events:auto;background:#18251eeF;color:#edf3e9;border:1px solid #82908077;border-radius:10px;padding:10px 13px;font-weight:700;font-size:12px}.btn:active{background:#3a4c3d}.controls{position:absolute;left:12px;bottom:12px;display:grid;grid-template-columns:38px 38px 38px;grid-template-rows:38px 38px;gap:4px}.controls button{pointer-events:auto;background:#17231dcc;border:1px solid #b3c0a466;color:white;border-radius:9px;font-size:18px}.controls .up{grid-column:2}.controls .left{grid-column:1;grid-row:2}.controls .down{grid-column:2;grid-row:2}.controls .right{grid-column:3;grid-row:2}.overlay{position:absolute;inset:0;background:#050b08b8;display:grid;place-items:center;padding:16px}.dialog{width:min(430px,100%);background:#18241d;border:1px solid #9aa78a66;border-radius:16px;padding:20px;box-shadow:0 20px 60px #0009}.dialog h2{margin:0 0 8px;color:#e9c58d}.dialog p{font-size:13px;line-height:1.6;color:#d0d9cc}.items{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.item{padding:8px 10px;border-radius:8px;background:#26362a;border:1px solid #70836c;font-size:12px}.hidden{display:none!important}.back{position:absolute;right:12px;bottom:12px}.toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);background:#1b2b20;border:1px solid #a2ad8b;border-radius:10px;padding:10px 14px;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none}.toast.show{opacity:1}@media(min-width:800px){.controls{display:none}.bottom{left:auto;right:12px;transform:none}.back{right:12px;bottom:70px}}
</style></head><body>
<canvas id="world"></canvas>
<div class="hud"><div class="panel"><div class="brand">SKYREALM · APOCALYPSE</div><div class="stat" id="health">❤ 100 / 100</div><div class="stat" id="day">День 1 · Поселение</div></div><div class="panel quest"><b>ЕЖЕДНЕВНОЕ ЗАДАНИЕ</b><p id="questText">Собери 3 детали с разбитых машин и вернись к Марку.</p><div class="stat" id="questProgress">Детали: 0 / 3</div></div></div>
<div class="controls"><button class="up" data-key="ArrowUp">↑</button><button class="left" data-key="ArrowLeft">←</button><button class="down" data-key="ArrowDown">↓</button><button class="right" data-key="ArrowRight">→</button></div>
<div class="bottom"><button class="btn" id="action">Действие · E</button><button class="btn" id="inventory">Рюкзак · I</button></div><button class="btn back" id="exit">В Hub</button>
<div class="toast" id="toast"></div>
<div class="overlay" id="dialogue"><div class="dialog"><h2>Апокалипсис</h2><p>Поселение на окраине разрушенного города. Найди выжившего Марка, собирай припасы и выполняй ежедневные поручения.</p><button class="btn" id="start">Начать выживание</button></div></div>
<div class="overlay hidden" id="panel"><div class="dialog"><h2 id="panelTitle">Марк</h2><p id="panelText"></p><div class="items" id="items"></div><button class="btn" id="panelClose">Закрыть</button></div></div>
<script src="apocalypse.js"></script></body></html>
